<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kargo Etiketi - Yazdır</title>
<style>
  /* order_label.html ile birebir: 100x100 mm rulo, kenar boşluğu yok → tarayıcı başlık/altlık basmaz */
  @page { size: 100mm 100mm; margin: 0; }
  html, body { width:100mm; height:100mm; margin:0; padding:0; background:#fff; }
  * { box-sizing: border-box; }
  .label{ width:100mm; height:100mm; display:flex; align-items:center; justify-content:center;
          overflow:hidden; page-break-inside: avoid; }
  .label img{ max-width:100mm; max-height:100mm; width:auto; height:auto; display:block; image-rendering: crisp-edges; }
</style>
</head>
<body>
  <div class="label"><img src="data:image/png;base64,{{ png_b64 }}" alt="MNG etiket {{ kayit.barkod }}"></div>
  <script>
    window.onload = function () {
      window.print();
      window.onafterprint = function () { window.close(); };
    };
  </script>
</body>
</html>
