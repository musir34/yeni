<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kargo Etiketi - Yazdır</title>
<style>
  /* order_label.html ile birebir: 100x100 mm rulo, kenar boşluğu yok → tarayıcı başlık/altlık basmaz */
  @page { size: 100mm 100mm; margin: 0; }
  html, body { width:100mm; height:100mm; margin:0; padding:0; background:#fff; }
  * { box-sizing: border-box; }
  .label{ width:100mm; height:100mm; display:flex; align-items:center; justify-content:center;
          overflow:hidden; page-break-inside: avoid; }
  .label img, .label svg{ max-width:100mm; max-height:100mm; width:auto; height:auto; display:block; }
  .label img{ image-rendering: crisp-edges; }
  @media print {
    /* Tarayıcı eklentilerinin (ör. Claude imleç halkası) sayfaya eklediği öğeler etikete basılmasın */
    body > *:not(.label) { display: none !important; }
    .label { position: fixed; top: 0; left: 0; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="label">
    {% if svg %}{{ svg|safe }}{% else %}<img src="data:image/png;base64,{{ png_b64 }}" alt="MNG etiket {{ kayit.barkod }}">{% endif %}
  </div>
  <script>
    window.onload = function () {
      window.print();
      window.onafterprint = function () { window.close(); };
    };
  </script>
</body>
</html>
